<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dcaps - Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0d0606;
    --bg-1:#160909;
    --card:#1c0d0d;
    --red:#c81e3a;
    --red-dark:#8f1226;
    --gold:#e8b84b;
    --text:#f4ece6;
    --text-mut:#c9a9a9;
    --border:#3a1518;
  }
  *{box-sizing:border-box;}
  @keyframes fadeSlideDown{
    from{opacity:0; transform:translateY(-14px);}
    to{opacity:1; transform:translateY(0);}
  }
  @keyframes fadeSlideUp{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }
  @keyframes promoPulse{
    0%,100%{box-shadow:0 0 0 0 rgba(200,30,58,0.35);}
    50%{box-shadow:0 0 0 8px rgba(200,30,58,0);}
  }
  @keyframes promoShine{
    0%{background-position:-1000px 0;}
    100%{background-position:1000px 0;}
  }
  @keyframes promoGlow{
    0%{text-shadow:0 0 10px rgba(200,30,58,0.4), 0 0 20px rgba(200,30,58,0.2);}
    50%{text-shadow:0 0 20px rgba(200,30,58,0.8), 0 0 40px rgba(232,184,75,0.4);}
    100%{text-shadow:0 0 10px rgba(200,30,58,0.4), 0 0 20px rgba(200,30,58,0.2);}
  }
  @keyframes floatRed1{
    0%{transform:translateY(0) translateX(0) scale(1); opacity:0.3;}
    50%{opacity:0.6;}
    100%{transform:translateY(-100px) translateX(30px) scale(1.1); opacity:0.2;}
  }
  @keyframes floatRed2{
    0%{transform:translateY(0) translateX(0) scale(1); opacity:0.2;}
    50%{opacity:0.5;}
    100%{transform:translateY(-120px) translateX(-40px) scale(1.15); opacity:0.15;}
  }
  @keyframes bounceIn{
    0%{opacity:0; transform:scale(0.5);}
    60%{opacity:1; transform:scale(1.08);}
    100%{transform:scale(1);}
  }
  @keyframes greenPulse{
    0%,100%{box-shadow:0 0 0 0 rgba(37,211,102,0.45);}
    50%{box-shadow:0 0 0 9px rgba(37,211,102,0);}
  }
  button{transition:transform 0.12s ease;}
  button:active{transform:scale(0.92);}
  body{
    margin:0;
    font-family:'Inter', Arial, sans-serif;
    background:radial-gradient(circle at 50% 0%, var(--bg-1), var(--bg-0) 60%);
    color:var(--text);
    min-height:100vh;
    padding-bottom:100px;
    position:relative;
    overflow-x:hidden;
  }
  body::before{
    content:'';
    position:fixed;
    top:-50%;
    left:-50%;
    width:200%;
    height:200%;
    background:radial-gradient(circle at 20% 50%, rgba(200,30,58,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(200,30,58,0.05) 0%, transparent 50%);
    animation:floatRed1 15s ease-in-out infinite;
    z-index:-1;
    pointer-events:none;
  }
  body::after{
    content:'';
    position:fixed;
    top:-50%;
    right:-50%;
    width:200%;
    height:200%;
    background:radial-gradient(circle at 60% 40%, rgba(232,184,75,0.04) 0%, transparent 40%),
                radial-gradient(circle at 30% 60%, rgba(200,30,58,0.06) 0%, transparent 50%);
    animation:floatRed2 18s ease-in-out infinite;
    z-index:-1;
    pointer-events:none;
  }
  .top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 18px;
  }
  .whatsapp-btn{
    background:#25d366;
    color:#062910;
    border:none;
    padding:9px 16px;
    border-radius:999px;
    font-weight:700;
    font-size:14px;
    display:flex;
    align-items:center;
    gap:6px;
    cursor:pointer;
    text-decoration:none;
  }
  .icon-btn{
    background:none;
    border:1px solid var(--border);
    color:var(--text);
    border-radius:999px;
    width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:16px;
  }
  header{
    text-align:center;
    padding:6px 20px 18px;
  }
  .logo-wrap{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:6px;
  }
  .logo-cap{
    width:64px;
    height:64px;
    border-radius:50%;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .logo-cap img{
    width:100%;
    height:100%;
    object-fit:contain;
  }
  h1{
    margin:0;
    font-family:'Anton', 'Inter', sans-serif;
    font-size:44px;
    letter-spacing:2px;
    font-weight:400;
    text-shadow:0 0 22px rgba(200,30,58,0.45);
    animation:fadeSlideDown 0.6s ease both;
  }
  h1 span{color:var(--red);}
  .tagline{
    color:var(--gold);
    font-size:13px;
    letter-spacing:4px;
    text-transform:uppercase;
    margin-top:6px;
    font-weight:600;
    animation:fadeSlideDown 0.6s ease 0.15s both;
  }
  .promo-banner{
    margin:18px auto;
    max-width:520px;
    background:linear-gradient(90deg, rgba(200,30,58,0.15), rgba(200,30,58,0.35), rgba(200,30,58,0.15));
    border:1px solid var(--red);
    border-radius:999px;
    text-align:center;
    padding:12px 20px;
    font-weight:700;
    font-size:15px;
    letter-spacing:1px;
    animation:fadeSlideUp 0.6s ease 0.2s both, promoPulse 2.4s ease-in-out 1s infinite, promoGlow 3s ease-in-out 1.2s infinite;
    position:relative;
    overflow:hidden;
    z-index:1;
  }
  .promo-banner::before{
    content:'';
    position:absolute;
    top:0;
    left:0;
    right:0;
    bottom:0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    animation:promoShine 3.5s linear infinite;
    pointer-events:none;
    z-index:2;
  }
  .promo-banner > * {
    position:relative;
    z-index:3;
  }
  .promo-banner .price{color:var(--gold); font-size:18px;}
  .stats-row{
    display:flex;
    justify-content:center;
    gap:28px;
    flex-wrap:wrap;
    padding:6px 20px 20px;
    font-size:14px;
    color:var(--text-mut);
    border-bottom:1px solid var(--border);
    margin:0 16px;
  }
  .stats-row b{color:var(--text);}
  .category-tabs{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    padding:16px 20px;
    max-width:1000px;
    margin:0 auto;
  }
  .category-btn{
    background:transparent;
    border:1.5px solid var(--border);
    color:var(--text-mut);
    padding:9px 16px;
    border-radius:999px;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    letter-spacing:0.5px;
    transition:all 0.2s ease;
    text-transform:uppercase;
  }
  .category-btn:hover{    border-color:var(--red);
    color:var(--text);
  }
  .category-btn.active{
    background:var(--red);
    border-color:var(--red);
    color:#fff;
    box-shadow:0 0 20px rgba(200,30,58,0.4);
    animation:bounceIn 0.3s ease;
  }
  .add-product-bar{
    display:flex;
    justify-content:center;
    padding:18px 20px 4px;
  }
  .add-btn{
    background:var(--red);
    color:#fff;
    border:none;
    padding:12px 22px;
    border-radius:10px;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .add-btn:hover{background:#e0264a;}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(230px, 1fr));
    gap:18px;
    padding:20px;
    max-width:1000px;
    margin:0 auto;
  }
  .product-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    position:relative;
    animation:fadeSlideUp 0.5s ease both;
    transition:border-color 0.2s ease, transform 0.2s ease;
  }
  .product-card:hover{border-color:var(--red); transform:translateY(-3px);}
  .product-img-wrap{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    background:#241010;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .product-img-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .no-img{
    font-size:44px;
    opacity:0.35;
  }
  .price-tag{
    position:absolute;
    top:10px;
    right:10px;
    background:var(--red);
    color:#fff;
    font-weight:800;
    font-size:14px;
    padding:5px 12px;
    border-radius:999px;
  }
  .edit-tag{
    position:absolute;
    top:10px;
    left:10px;
    background:rgba(0,0,0,0.55);
    color:#fff;
    border:none;
    border-radius:999px;
    width:32px;
    height:32px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:14px;
  }
  .product-info{
    padding:14px 14px 16px;
  }
  .product-name{
    font-family:'Anton', 'Inter', sans-serif;
    font-weight:400;
    font-size:17px;
    margin:0 0 4px;
    text-transform:uppercase;
    letter-spacing:0.5px;
  }
  .product-meta{
    color:var(--text-mut);
    font-size:13px;
    margin:0 0 12px;
  }
  .order-btn{
    width:100%;
    background:transparent;
    border:1.5px solid var(--red);
    color:#fff;
    padding:10px;
    border-radius:8px;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    letter-spacing:0.5px;
  }
  .order-btn:hover{background:var(--red);}
  .order-stepper{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    background:var(--red);
    border-radius:8px;
    padding:6px;
    animation:bounceIn 0.35s ease both;
  }
  .order-stepper button{
    width:30px;
    height:30px;
    border-radius:6px;
    border:none;
    background:rgba(255,255,255,0.18);
    color:#fff;
    font-weight:800;
    font-size:16px;
    cursor:pointer;
  }
  .order-stepper button:hover{background:rgba(255,255,255,0.3);}
  .order-stepper .stepper-qty{
    color:#fff;
    font-weight:800;
    font-size:15px;
  }
  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--text-mut);
  }
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--bg-1);
    border:1px solid var(--border);
    border-radius:16px;
    padding:22px;
    width:100%;
    max-width:400px;
    max-height:90vh;
    overflow-y:auto;
  }
  .modal h2{
    margin:0 0 16px;
    font-size:19px;
  }
  .field{margin-bottom:12px;}
  .field label{
    display:block;
    font-size:12px;
    color:var(--text-mut);
    margin-bottom:5px;
    text-transform:uppercase;
    letter-spacing:0.5px;
  }
  .field input, .field textarea, .field select{
    width:100%;
    background:#241010;
    border:1px solid var(--border);
    color:var(--text);
    padding:9px 11px;
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
  }
  .field textarea{resize:vertical; min-height:50px;}
  .unavailable-badge{
    position:absolute;
    inset:0;
    background:rgba(13,6,6,0.72);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-weight:800;
    font-size:13px;
    letter-spacing:1px;
    text-transform:uppercase;
  }
  .product-card.unavailable .order-btn{
    opacity:0.4;
    pointer-events:none;
  }
  .modal-actions{
    display:flex;
    gap:10px;
    margin-top:16px;
  }
  .modal-actions button{
    flex:1;
    padding:11px;
    border-radius:8px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    border:none;
  }
  .btn-save{background:var(--red); color:#fff;}
  .btn-cancel{background:transparent; border:1px solid var(--border); color:var(--text);}
  .btn-delete{
    background:transparent;
    color:#e0264a;
    border:1px solid #5a1a24;
    width:100%;
    padding:10px;
    border-radius:8px;
    margin-top:10px;
    font-weight:700;
    cursor:pointer;
  }
  .error-msg{color:#ff8a8a; font-size:12px; margin-top:-6px; margin-bottom:10px; display:none;}
  .loading-msg{text-align:center; color:var(--text-mut); padding:40px;}

  .qty-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
  }
  .qty-btn{
    width:32px;
    height:32px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#241010;
    color:var(--text);
    font-weight:700;
    font-size:16px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .qty-val{
    min-width:26px;
    text-align:center;
    font-weight:700;
    font-size:15px;
  }

  .cart-fab{
    position:fixed;
    right:18px;
    bottom:18px;
    width:56px;
    height:56px;
    background:var(--red);
    color:#fff;
    border:none;
    border-radius:50%;
    font-size:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:90;
  }
  .cart-fab .badge{
    position:absolute;
    top:-4px;
    right:-4px;
    background:#fff;
    color:var(--red-dark);
    border-radius:999px;
    min-width:20px;
    height:20px;
    padding:0 5px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:800;
  }
  .buy-here-btn{
    position:fixed;
    right:82px;
    bottom:26px;
    background:#25d366;
    color:#062910;
    border:none;
    border-radius:999px;
    padding:9px 16px;
    font-weight:800;
    font-size:13px;
    cursor:pointer;
    z-index:89;
    display:none;
    animation:bounceIn 0.4s ease both, greenPulse 2s ease-in-out 0.5s infinite;
  }
  .buy-here-btn.show{display:block;}
  .cart-drawer-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.65);
    z-index:110;
    align-items:flex-end;
    justify-content:center;
  }
  .cart-drawer-overlay.open{display:flex;}
  .cart-drawer{
    background:var(--bg-1);
    border-top:1px solid var(--border);
    border-radius:20px 20px 0 0;
    width:100%;
    max-width:480px;
    max-height:80vh;
    display:flex;
    flex-direction:column;
    padding:20px;
  }
  .cart-drawer h2{
    margin:0 0 14px;
    font-size:19px;
  }
  .cart-items{
    overflow-y:auto;
    flex:1;
    margin-bottom:14px;
  }
  .cart-line{
    display:flex;
    align-items:flex-start;
    gap:14px;
    padding:14px 0;
    border-bottom:1px solid var(--border);
  }
  .cart-line-image{
    width:90px;
    height:90px;
    flex-shrink:0;
    border-radius:10px;
    background:#241010;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    border:1px solid var(--border);
  }
  .cart-line-image img{
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .cart-line-info{flex:1; min-width:0;}
  .cart-line-name{
    font-weight:700;
    font-size:15px;
    margin-bottom:3px;
    color:var(--text);
    text-transform:uppercase;
    letter-spacing:0.5px;
  }
  .cart-line-price{
    color:var(--text-mut);
    font-size:13px;
    margin-bottom:10px;
  }
  .cart-line-right{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:8px;
  }
  .cart-line-controls{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .cart-qty-btn{
    width:32px;
    height:32px;
    border-radius:6px;
    border:1px solid var(--border);
    background:#241010;
    color:var(--text);
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .cart-qty-btn:hover{background:var(--red);}
  .cart-qty-val{
    min-width:20px;
    text-align:center;
    font-weight:700;
    font-size:14px;
  }
  .cart-remove{
    background:none;
    border:none;
    color:var(--red);
    font-size:13px;
    cursor:pointer;
    text-decoration:underline;
  }
  .cart-empty{
    text-align:center;
    color:var(--text-mut);
    padding:30px 10px;
  }
  .cart-total-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:16px;
    font-weight:800;
    padding-top:6px;
    margin-bottom:10px;
    border-top:1px solid var(--border);
    padding-bottom:6px;
  }
  .cart-total-row .amount{color:var(--gold); font-size:22px;}
  .cart-total-row .amount .original{
    color:var(--text-mut);
    text-decoration:line-through;
    margin-right:6px;
    font-size:16px;
  }
  .promo-active-msg{
    text-align:center;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.3px;
    color:#25d366;
    margin-top:-4px;
    margin-bottom:10px;
    min-height:0;
    display:none;
  }
  .promo-active-msg.show{
    display:block;
    animation:fadeSlideUp 0.4s ease both;
  }
  .checkout-btn{
    width:100%;
    background:#25d366;
    color:#062910;
    border:none;
    padding:14px;
    border-radius:10px;
    font-weight:800;
    font-size:15px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .checkout-btn:disabled{
    opacity:0.4;
    cursor:not-allowed;
  }
  .close-drawer{
    background:none;
    border:1px solid var(--border);
    color:var(--text);
    border-radius:999px;
    width:32px;
    height:32px;
    cursor:pointer;
    float:right;
  }
</style>
</head>
<body>

<div class="top-bar">
  <a class="whatsapp-btn" id="waBtn" href="#" target="_blank">WhatsApp</a>

  <button class="icon-btn" id="soundBtn" title="Sonido" aria-label="Sonido">🔊</button>
</div>
